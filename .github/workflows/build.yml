name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libzstd-dev

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build

      - name: Verify binary
        run: ./build/ftransfer --help || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ftransfer
          path: build/ftransfer
